name: Plugin checks (no deployment)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Update contract tests
        run: php tests/updates.php
      - name: Merchant account lifecycle tests
        run: php tests/vendor-accounts.php
      - name: Build release assets (no publication)
        run: python3 tools/build-release.py
